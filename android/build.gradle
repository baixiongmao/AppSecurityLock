group = "com.example.app_security_lock"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// 兼容 Flutter < 3.44：AGP < 9 仍需自行应用 KGP；AGP 9+ 交给内置 Kotlin。
// 使用 apply(plugin:) 方法调用，避免 Flutter 静态正则把条件 apply 误判为「插件仍在使用 KGP」。
// 参考: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = 0
try {
    agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
} catch (Throwable ignored) {
    agpMajor = 0
}
def builtInKotlinProp = project.findProperty("android.builtInKotlin")
def useBuiltInKotlin = builtInKotlinProp != null
        ? builtInKotlinProp.toString().toBoolean()
        : agpMajor >= 9
if (!useBuiltInKotlin) {
    apply(plugin: "org.jetbrains.kotlin.android")
}

android {
    namespace = "com.example.app_security_lock"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// 配置 Kotlin JVM target（KGP 2.0+ / 内置 Kotlin 的 compilerOptions DSL）
def kotlinAndroidExt = project.extensions.findByType(org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension)
if (kotlinAndroidExt != null) {
    kotlinAndroidExt.compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
